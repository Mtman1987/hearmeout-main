name: Inspect persistent data volumes (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-persistent-volumes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-volumes:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inventory volume metadata and file names
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "No Fly API token is configured in repository Actions secrets."
            exit 1
          fi
          echo "::group::HearMeOut volume metadata"
          flyctl volumes list --app hearmeout-main
          flyctl machines list --app hearmeout-main
          echo "::endgroup::"
          echo "::group::Read-only /data file inventory"
          timeout 45s flyctl ssh console --app hearmeout-main -C 'find /data -xdev -maxdepth 4 -type f -printf "%p\t%s bytes\n" 2>/dev/null | sort | head -300'
          echo "::endgroup::"
          echo "Inventory complete. This workflow lists file paths and sizes only; it does not print file contents or modify the volume."

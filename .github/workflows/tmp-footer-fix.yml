name: Footer regression fix
on:
  push:
    branches: [fix/footer-regression]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/footer-regression
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/spmt-workspace-host.tsx')
          s=p.read_text()
          s=s.replace('const [embedded, setEmbedded] = React.useState(true);','const [embedded, setEmbedded] = React.useState(false);')
          s=s.replace('    if (!isEmbedded) void refresh();','    void refresh();')
          s=s.replace('    if (hiddenRoute || embedded) return;','    if (hiddenRoute) return;')
          s=s.replace('  }, [embedded, hiddenRoute, refresh]);','  }, [hiddenRoute, refresh]);')
          s=s.replace('  }, [embedded, hiddenRoute]);','  }, [hiddenRoute]);')
          s=s.replace('  if (hiddenRoute || embedded || !footerVisible) return null;','  if (hiddenRoute || !footerVisible) return null;')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/spmt-workspace-host.tsx
          git commit -m "Restore workspace footer in framed app views"
          git push

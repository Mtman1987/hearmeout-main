name: SPMT Shell Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test SPMT bot command routing
        run: node --import tsx --test tests/spmt-athena-route.test.ts
      - name: Test SPMT OAuth callback routing
        run: node --import tsx --test tests/spmt-auth-callback.test.ts
      - name: Test private Athena bootstrap routing
        run: node --import tsx --test tests/private-assistant-middleware.test.ts
      - name: Test workspace shell parity
        run: node --import tsx --test tests/spmt-shell-parity.test.ts
      - name: Test workspace theme contract
        run: npm run test:workspace-theme
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

name: HearMeOut room audio checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/rooms/persona-speech/**'
      - 'src/app/rooms/**'
      - 'src/middleware.ts'
      - 'tests/room-say-player-audio.test.cjs'
      - '.github/workflows/room-say-player-check.yml'

permissions:
  contents: read

jobs:
  room-audio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check room-scoped Say Player wiring
        run: node --test tests/room-say-player-audio.test.cjs
      - name: Typecheck
        run: npm run typecheck

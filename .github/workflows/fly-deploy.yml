name: Build HearMeOut image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hmo-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-main-image:
    name: Build main image for direct Fly release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build image only
        run: flyctl deploy . --build-only --remote-only --config fly.toml --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}

name: Deploy to Fly.io

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-housekeeping:
    name: Retain newest merged branch backup
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Delete older branches already contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository?.default_branch || 'main';
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const merged = [];
            for (const branch of branches) {
              if (!branch?.name || branch.name === defaultBranch) continue;
              const comparison = await github.rest.repos.compareCommits({
                owner, repo, base: branch.name, head: defaultBranch,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.notice(`Retaining unmerged branch ${branch.name}.`);
                continue;
              }
              const commit = await github.rest.repos.getCommit({ owner, repo, ref: branch.commit.sha });
              const date = commit.data.commit.committer?.date || commit.data.commit.author?.date || '1970-01-01T00:00:00Z';
              merged.push({ name: branch.name, sha: branch.commit.sha, date });
            }
            merged.sort((a, b) => Date.parse(b.date) - Date.parse(a.date));
            const newest = merged[0];
            if (newest) core.notice(`Keeping newest merged branch backup ${newest.name} (${newest.sha}).`);
            for (const branch of merged.slice(1)) {
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch.name}` });
                core.notice(`Deleted older merged branch ${branch.name}.`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.warning(`Could not delete ${branch.name}; it may be protected or already absent.`);
                  continue;
                }
                throw error;
              }
            }

  validate:
    needs: branch-housekeeping
    name: Validate voice and persona contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check worker JavaScript syntax
        run: |
          node --check worker/src/discord-pcm-jitter.js
          node --check worker/src/discord-voice-bridge.js
          node --check worker/src/persona-runtime-adapter.js
          node --check worker/src/persona-bootstrap.js
      - name: Test Discord bridge and HearMeOut persona runtime
        run: node --test tests/voice-bridge-privacy-gate.test.cjs tests/discord-voice-jitter-buffer.test.cjs tests/persona-runtime.test.cjs

  deploy-main:
    needs: [branch-housekeeping, validate]
    name: Deploy main app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy hearmeout-main
        run: flyctl deploy . --remote-only --config fly.toml --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}

  deploy-worker:
    needs: [branch-housekeeping, validate]
    name: Deploy DJ worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure hmo-dj-worker data volumes
        run: |
          set -euo pipefail
          flyctl scale count 1 -a hmo-dj-worker --yes
          unattached="$(flyctl volumes list -a hmo-dj-worker --json | jq '[.[] | select(.name == "data" and .region == "iad" and ((.attached_machine_id // "") == ""))] | length')"
          if [ "$unattached" -lt 1 ]; then
            flyctl volume create data -a hmo-dj-worker -r iad -n 1 --size 10 --yes
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER || secrets.FLY_API_TOKEN }}
      - name: Deploy hmo-dj-worker
        run: flyctl deploy . --remote-only --config worker/fly.toml --strategy immediate --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER || secrets.FLY_API_TOKEN }}
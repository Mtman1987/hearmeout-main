name: Deploy HearMeOut worker processes

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/fly-deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hearmeout-worker-deploy-main
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WORKER || secrets.FLY_API_TOKEN || secrets.FLY_API_TOKEN_MAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select affected worker processes
        id: scope
        env:
          DEPLOY_BEFORE: ${{ github.event.before }}
          DEPLOY_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          target=all
          if [ -n "$DEPLOY_BEFORE" ] && git cat-file -e "$DEPLOY_BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$DEPLOY_BEFORE" "$DEPLOY_AFTER" -- worker/)
            if [ "$changed" = "worker/src/spotlight-hls.js" ]; then target=spotlight; fi
            if [ "$changed" = "worker/fly.toml" ]; then
              target=$(node <<'NODE'
          const fs=require('fs'),{execFileSync}=require('child_process');
          const before=execFileSync('git',['show',process.env.DEPLOY_BEFORE+':worker/fly.toml'],{encoding:'utf8'});
          const after=fs.readFileSync('worker/fly.toml','utf8');
          const old='processes = ["lounge"]\n  memory = "2gb"\n  cpu_kind = "performance"\n  cpus = 1';
          const next='processes = ["lounge"]\n  memory = "2gb"\n  cpu_kind = "shared"\n  cpus = 2';
          process.stdout.write(before.includes(old)&&after===before.replace(old,next)?'lounge':'all');
          NODE
              )
            fi
          fi
          # A new on-demand Activity role must not restart the live Lounge/DJ.
          if [ -n "${changed:-}" ] && ! echo "$changed" | grep -qvE '^worker/(fly.toml|scripts/run-role.sh)$'; then
            if git diff "$DEPLOY_BEFORE" "$DEPLOY_AFTER" -- worker/fly.toml | grep -q '^+.*activity'; then target=activity; fi
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Check Lounge state and routing
        run: |
          node --check worker/src/server.js
          node --test worker/tests/lounge-program.test.cjs
          node --check worker/src/spotlight-hls.js
          node --test tests/spotlight-stall.test.cjs tests/spotlight-source-contract.test.cjs
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy affected process groups
        env:
          DEPLOY_TARGET: ${{ steps.scope.outputs.target }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DEPLOY_TARGET" = "spotlight" ] || [ "$DEPLOY_TARGET" = "lounge" ] || [ "$DEPLOY_TARGET" = "activity" ]; then args+=(--process-groups "$DEPLOY_TARGET"); fi
          flyctl deploy . --config worker/fly.toml --dockerfile worker/Dockerfile --remote-only --ha=false --yes "${args[@]}"
      - name: Check Lounge and Spotlight feeds
        run: |
          set -euo pipefail
          for port in 4444 4445 4446; do
            ready=false
            for attempt in {1..18}; do
              if curl --fail --silent --show-error --max-time 10 "https://hmo-dj-worker.fly.dev:${port}/health"; then
                ready=true
                break
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "Process port ${port} did not become healthy" >&2
              exit 1
            fi
          done

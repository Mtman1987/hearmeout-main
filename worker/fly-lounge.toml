app = "hmo-lounge-worker"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3002"
  APP_URL = "https://hearmeout-main.fly.dev"
  HMO_WORKER_ROLE = "lounge"
  HMO_LOUNGE_DIRECT_ONLY = "true"
  HMO_PRIVATE_RENDERER = "false"
  RESTREAM_PROFILE_DIR = "/data/restream-chromium"
  RESTREAM_AUTOMATION_ENABLED = "false"

[mounts]
  source = "data"
  destination = "/data"
  initial_size = "8gb"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

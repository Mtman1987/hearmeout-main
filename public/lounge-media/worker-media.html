<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpaceMountain Lounge media</title>
<style>html,body,video{margin:0;width:100%;height:100%;overflow:hidden;background:#000}video{display:block;object-fit:contain}#channel-bug{position:absolute;right:2%;bottom:2%;width:clamp(34px,8%,78px);height:auto;pointer-events:none;z-index:1}#status{position:absolute;inset:0;display:grid;place-items:center;padding:6%;box-sizing:border-box;background:radial-gradient(circle,#20153d,#090919 65%,#000);color:#fff;text-align:center;font:600 clamp(16px,2.5vw,30px) system-ui;z-index:2}#status[hidden]{display:none}#enable-audio{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;padding:12px 18px;border:1px solid #fff;border-radius:999px;background:#101626;color:#fff;font:700 16px system-ui;cursor:pointer}#enable-audio[hidden]{display:none}</style></head>
<body><video id="player" autoplay playsinline></video><img id="channel-bug" src="/lounge-media/munch-tv-bug.gif" alt="Munch TV"><button id="enable-audio" type="button" hidden>🔊 Enable Audio</button><div id="status" role="status">Connecting to Lounge worker</div>
<script src="https://hmo-dj-worker.fly.dev:4444/lounge/hls.js"></script>
<script>
(() => {
  const worker = 'https://hmo-dj-worker.fly.dev:4444';
  const video = document.getElementById('player');
  const status = document.getElementById('status');
  const enableAudio = document.getElementById('enable-audio');
  video.muted = false;
  enableAudio.addEventListener('click', () => { volume(); void video.play().then(() => { enableAudio.hidden = true; }).catch(() => {}); });
  let hls, selection = '', mix = .85, master = 1, source = 1, programLevel = 1, focus = 1, muted = false, programMuted = false, epoch = 0;
  function volume(){
    video.volume = Math.max(0, Math.min(1, mix * master * source * programLevel * focus));
    video.muted = muted || programMuted;
  }
  volume();
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.origin !== 'https://spmt.live') return;
    if (event.data?.type === 'spmt.obspmt.audio') {
      const level = Number(event.data.volume);
      if (Number.isFinite(level) && level >= 0 && level <= 1 && typeof event.data.muted === 'boolean') {
        source = level; muted = event.data.muted; volume();
      }
    }
    if (event.data?.type === 'spmt-lounge-program-focus' && typeof event.data.focused === 'boolean') {
      focus = event.data.focused ? 1 : .2; volume();
    }
    if (event.data?.type === 'spmt-lounge-unmute-pulse') {
      void resume();
    }
  });
  let mixPending = false, pollPending = false;
  async function refreshVolume(){
    if (mixPending) return;
    mixPending = true;
    try {
      const response = await fetch('https://streamweaver-new.fly.dev/api/lounge/audio-mix', {cache:'no-store',signal:AbortSignal.timeout(20000)});
      if (!response.ok) return;
      const payload = await response.json();
      const levels = payload.levels;
      const media = Number(levels?.media), all = Number(levels?.all ?? 100);
      if (media >= 0 && media <= 100 && all >= 0 && all <= 100) {mix = media/100;master = all/100;volume();}
    } catch {} finally { mixPending = false; }
  }
  async function resume(){
    if (video.ended || !video.paused || video.readyState < 3) return;
    try {
      await video.play();
      enableAudio.hidden = true;
    } catch (error) {
      if (error?.name === 'NotAllowedError') {
        status.hidden = false;
        status.textContent = 'Tap Enable Audio to start playback';
        enableAudio.hidden = false;
      }
    }
  }
  video.addEventListener('canplay',()=>void resume());
  video.addEventListener('progress',()=>void resume());
  video.addEventListener('timeupdate',()=>void resume());
  video.addEventListener('playing',()=>{status.hidden=true;enableAudio.hidden=true;});
  async function poll(){
    if (pollPending) return;
    pollPending = true;
    try {
      const response = await fetch(worker+'/lounge/media/program',{cache:'no-store',signal:AbortSignal.timeout(30000)});
      if (!response.ok) throw Error('Worker returned '+response.status);
      const program = await response.json();
      const lane = program.movie?.current && program.movie.playback?.status === 'playing' ? 'movie'
        : program.music?.current && program.music.playback?.status === 'playing' ? 'music' : '';
      programLevel = lane ? Math.max(0, Math.min(1, Number(program[lane].playback?.volume ?? 100) / 100)) : 1;
      programMuted = lane ? !!program[lane].playback?.muted : false;
      volume();
      const item = lane && program[lane].current;
      let info = null;
      if (lane === 'movie') {
        const statusResponse = await fetch(worker+'/lounge/direct/status',{cache:'no-store',signal:AbortSignal.timeout(30000)});
        if (!statusResponse.ok) throw Error('Movie worker returned '+statusResponse.status);
        info = await statusResponse.json();
      }
      const next = item ? lane+':'+item.requestId+(lane==='movie'&&info?.generation?':'+info.generation:'') : '';
      if (!next) { if (selection) { selection='';hls?.destroy();video.pause();video.removeAttribute('src');video.load();} enableAudio.hidden=true;status.hidden=false;status.textContent='Waiting for a Lounge request';return; }
      if (next === selection) { if (!video.ended) void resume(); return; }
      hls?.destroy(); hls = null; video.pause(); video.removeAttribute('src'); video.load();
      if (lane === 'movie') {
        if (!info?.ready || info.requestId !== item.requestId || !info.streamKey) {selection='';status.hidden=false;status.textContent=info?.error || 'Preparing '+item.item.title;return;}
      }
      selection=next;const myEpoch=++epoch;enableAudio.hidden=true;status.hidden=false;status.textContent='Buffering '+item.item.title;
      const videoId=String(item.item?.metadata?.videoId||'');
      const url=worker+(lane==='movie'?'/lounge/direct/hls/'+encodeURIComponent(info.streamKey)+'/index.m3u8':'/lounge/music/hls/'+encodeURIComponent(videoId)+'/index.m3u8');
      if (window.Hls?.isSupported()) {
        hls=new Hls({
          startPosition:-1,
          liveSyncDurationCount:3,
          liveMaxLatencyDurationCount:6,
          maxLiveSyncPlaybackRate:lane==='music'?1:1.05,
          maxBufferLength:30,
          maxMaxBufferLength:45,
          lowLatencyMode:false,
          manifestLoadingTimeOut:30000,
          levelLoadingTimeOut:30000,
          fragLoadingTimeOut:30000
        });
        hls.on(Hls.Events.ERROR,(_event,detail)=>{
          if(!detail.fatal||epoch!==myEpoch)return;
          if(detail.type===Hls.ErrorTypes.MEDIA_ERROR){try{hls.recoverMediaError();return}catch{}}
          if(detail.type===Hls.ErrorTypes.NETWORK_ERROR){try{hls.startLoad(-1);return}catch{}}
          hls.destroy();hls=null;selection='';status.hidden=false;status.textContent='Rejoining live movie feed';
        });
        hls.attachMedia(video);hls.on(Hls.Events.MEDIA_ATTACHED,()=>hls.loadSource(url));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) video.src=url;
      else {selection='';status.textContent='Media player unavailable';}
      volume();resume();
    } catch {
      if (!video.paused && video.readyState >= 2 && (!Number.isFinite(video.duration) || video.currentTime + .5 < video.duration)) {
        status.hidden=true; return;
      }
      status.hidden=false;status.textContent='Connecting to Lounge worker';
    } finally { pollPending = false; }
  }
  void poll();void refreshVolume();setInterval(poll,2500);setInterval(refreshVolume,3000);
})();
</script></body></html>
